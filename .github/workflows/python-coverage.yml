name: Python Coverage

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

jobs:
  coverage:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Install project dependencies
        run: python -m pip install -r requirements.txt

      - name: Install testing and coverage tools
        run: python -m pip install pytest pytest-cov

      - name: Run tests with coverage gate
        run: >-
          python -m pytest -v -ra --cov=src --cov-report=term-missing
          --cov-report=xml:coverage.xml --cov-fail-under=50

      - name: Comment coverage on pull request
        uses: py-cov-action/python-coverage-comment@v3.1
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
